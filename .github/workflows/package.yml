# 打包：用官方 OpenWrt SDK 交叉编译本项目，产出 apk 安装包
#   - 默认目标: airoha/an7581（snapshot SDK，gcc-14），可在 workflow_dispatch 时选择
#   - version=snapshot 走 downloads.openwrt.org/snapshots/，否则走 releases/<version>/
#   - SDK 压缩包名/校验和从 sha256sums 动态提取（gcc 版本随平台与版本不同，不硬编码）
#   - 将包输出目录（bin/）上传为 CI artifacts；打 tag 时自动发布到 GitHub Release
name: package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的分支或 tag（留空 = 默认分支）'
        required: false
        default: ''
      target:
        description: 'OpenWrt SDK 目标架构（如 airoha/an7581、ramips/mt7621、ipq40xx/generic）'
        required: false
        default: 'airoha/an7581'
      version:
        description: 'SDK 版本：snapshot（最新快照）或固定发行版号（如 24.10.0、23.05.5）'
        required: false
        default: 'snapshot'

# 允许 tag push 时创建/更新 Release（GITHUB_TOKEN 的 Contents: write 权限）
permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # SDK 下载后源包默认在 scripts/ 里解出的软件包会被覆盖，这里统一路径
  SDK_ROOT: ${{ github.workspace }}/sdk
  PKG_DIR: ${{ github.workspace }}/sdk/package/luci-app-huawei-cpe
  # Go 依赖走代理缓存，避免每次都重新拉取
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build:
    name: sdk-${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - airoha/an7581
          # 多架构打包：
          # - ramips/mt7621
          # - ipq40xx/generic
          # - mediatek/filogic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ---------- OpenWrt 构建系统依赖 ----------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext \
            texinfo unzip file rsync wget \
            libssl-dev zlib1g-dev python3 zstd

      # ---------- 下载并校验 OpenWrt SDK ----------
      - name: Download & verify OpenWrt SDK
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/openwrt-sdk"
          target="${{ matrix.target }}"
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="snapshot"
          echo "SDK_VERSION=$version" >> "$GITHUB_ENV"
          # target → 目录名（如 airoha/an7581 → airoha-an7581）
          if [ "$version" = "snapshot" ]; then
            base="https://downloads.openwrt.org/snapshots/targets/${target}"
          else
            base="https://downloads.openwrt.org/releases/${version}/targets/${target}"
          fi
          # 从 sha256sums 动态提取 SDK 压缩包名（gcc 版本随平台/版本不同，不硬编码）
          tarball=$(curl -fsSL "${base}/sha256sums" \
            | grep -oE 'openwrt-sdk-[^ ]+\.Linux-x86_64\.tar\.zst' | head -n1)
          [ -n "$tarball" ] || { echo "::error::sha256sums 中未找到 SDK 压缩包名（${base}）"; exit 1; }
          sha=$(curl -fsSL "${base}/sha256sums" | grep -F "$tarball" | awk '{print $1}' | head -n1)
          [ -n "$sha" ] || { echo "::error::未找到 SDK 校验和"; exit 1; }
          echo "SDK_TARBALL=$tarball"
          echo "SDK_TARBALL=$tarball" >> "$GITHUB_ENV"
          echo "SDK_URL=${base}/${tarball}"
          echo "SDK_URL=${base}/${tarball}" >> "$GITHUB_ENV"
          echo "SDK_SHA256=$sha"
          echo "SDK_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Cache SDK tarball
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sdk-cache
          key: openwrt-sdk-${{ matrix.target }}-${{ inputs.version || 'snapshot' }}

      - name: Extract SDK
        run: |
          set -euo pipefail
          dir="${SDK_TARBALL%.*}"; dir="${dir%.*}"; dir="${dir#openwrt-sdk-}"  # 仅用于日志显示
          # cache 未命中时目录不存在，先建目录
          mkdir -p .sdk-cache
          if [ ! -f ".sdk-cache/${SDK_TARBALL}" ]; then
            curl -fL --retry 3 --retry-all-errors "$SDK_URL" -o ".sdk-cache/${SDK_TARBALL}"
          fi
          echo "${SDK_SHA256}  .sdk-cache/${SDK_TARBALL}" | sha256sum -c -
          mkdir -p sdk
          tar --zstd -xf ".sdk-cache/${SDK_TARBALL}" -C sdk --strip-components=1
          ls sdk

      # ---------- feeds：只需要 packages（golang/jq）与 luci（luci-base） ----------
      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update packages luci

      - name: Install feed packages (all)
        working-directory: sdk
        run: |
          # 全量安装 packages/luci 两个 feed 的包，保证依赖树（如 liblua/lucihttp 等）可完整解析，
          # 避免出现 lucihttp 编译时缺 lua.h 之类的依赖缺失错误
          ./scripts/feeds install -a

      # ---------- Makefile 引用 $(TOPDIR)/../toolchain/golang/golang-package.mk ----------
      - name: Link golang toolchain (for Makefile include path)
        run: |
          set -euo pipefail
          # 仓库 Makefile 通过 $(TOPDIR)/../toolchain/golang/golang-package.mk 引用 golang 工具链，
          # 即在 SDK 外一层查找；这里用符号链接指向 feeds 中的 golang 包目录
          mkdir -p "${{ github.workspace }}/toolchain"
          ln -sfn "$SDK_ROOT/feeds/packages/lang/golang" "${{ github.workspace }}/toolchain/golang"
          ls -la "${{ github.workspace }}/toolchain"

      # ---------- 把本项目作为本地 package 放进去 ----------
      - name: Install package sources
        run: |
          set -euo pipefail
          mkdir -p "$PKG_DIR"
          # 只复制构建所需内容（避免把 .git / .github 本身打进去）
          cp -r Makefile luci root src LICENSE README.md "$PKG_DIR"/

      # ---------- 编译两个包 ----------
      - name: Compile packages
        working-directory: sdk
        run: |
          make defconfig
          # snapshot 已移除 lua5.1/liblua 旧包名，liblucihttp-lua 变体依赖它们无法编译（缺 lua.h）。
          # 本项目经 luci-base 只依赖 liblucihttp-ucode，不需要 lua 变体；显式禁用避免构建失败。
          # 注意：sed 后再跑 defconfig 会把设置覆盖回 =m，所以这里 sed 后直接编译。
          sed -i '/CONFIG_PACKAGE_liblucihttp-lua/d;/CONFIG_PACKAGE_luci-lib-base/d;/CONFIG_PACKAGE_liblua\b/d;/CONFIG_PACKAGE_lua=/d' .config
          echo '# CONFIG_PACKAGE_liblucihttp-lua is not set' >> .config
          echo '# CONFIG_PACKAGE_luci-lib-base is not set' >> .config
          grep -E 'liblucihttp|luci-lib-base' .config || true
          # 预热 golang host 工具链（路径为 feeds 安装后的标准位置）
          make package/feeds/packages/golang/host/compile V=s \
            || echo "::warning::golang host 构建失败，继续尝试主编译"
          # huawei-cpe + luci-app-huawei-cpe 两个包一次编译，依赖关系自动解析
          make package/luci-app-huawei-cpe/compile V=s

      # ---------- 收集产物 ----------
      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          # 只收集 apk 安装包（OpenWrt 24.10 新包格式），连带校验清单一并放平
          find sdk/bin -type f -name '*.apk' -print0 2>/dev/null \
            | xargs -0 -r -I{} cp -v {} dist/
          if [ -n "$(find dist -type f 2>/dev/null)" ]; then
            (cd dist && sha256sum * > SHA256SUMS)
            echo "产物清单："
            ls -la dist
          else
            echo "::error::未找到 apk 产物，请查看上方编译日志"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 14

      # ---------- 打 tag 时发布到 GitHub Release ----------
      - name: Publish release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}